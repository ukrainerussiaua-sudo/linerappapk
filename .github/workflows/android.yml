name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Prepare Android SDK (preinstalled on the runner)
        run: |
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          [ -x "$SDKM" ] || SDKM="$(command -v sdkmanager)"
          yes | "$SDKM" --licenses > /dev/null 2>&1 || true
          if [ -d "$ANDROID_HOME/platforms/android-35" ] && [ -d "$ANDROID_HOME/build-tools/35.0.0" ]; then
            echo "SDK 35 already installed"
          else
            for i in 1 2 3; do
              "$SDKM" "platforms;android-35" "build-tools;35.0.0" && break
              echo "sdkmanager attempt $i failed, retrying"; sleep 5
            done
          fi
          # a failure here is not fatal: gradle can fetch missing parts itself
          exit 0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile=false

      - name: Build web part and sync into Android project
        run: pnpm android:sync

      - name: Build APK
        working-directory: android
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: Liner-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
